name: Deploy

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  ci:
    uses: ./.github/workflows/ci.yml
    secrets: inherit

  deploy:
    name: Deploy to Cloudflare
    needs: ci
    runs-on: ubuntu-latest
    environment: production
    env:
      # Deploy / infra credentials
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
      TF_VAR_account_id: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      TF_VAR_zone_id: ${{ vars.CLOUDFLARE_ZONE_ID }}
      TF_VAR_mail_list: ${{ vars.MAIL_LIST }}
      TF_VAR_worker_name: ${{ vars.WORKER_NAME }}
      # Values rendered into wrangler.toml [vars]
      WORKER_NAME: ${{ vars.WORKER_NAME }}
      BOT_USERNAME: ${{ vars.BOT_USERNAME }}
      MAIL_LIST: ${{ vars.MAIL_LIST }}
      ALLOWED_CHAT_IDS: ${{ vars.ALLOWED_CHAT_IDS }}
      RESTRICT_SENDERS: ${{ vars.RESTRICT_SENDERS || 'false' }}
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - uses: opentofu/setup-opentofu@v1
        with:
          tofu_wrapper: false

      - name: Install dependencies
        run: uv sync --locked

      - name: Init OpenTofu backends
        run: |
          for module in infra/core infra/routing; do
            tofu -chdir="$module" init -input=false \
              -backend-config="bucket=${TF_STATE_BUCKET}" \
              -backend-config="endpoints={s3=\"https://${CLOUDFLARE_ACCOUNT_ID}.r2.cloudflarestorage.com\"}"
          done

      - name: Apply core infrastructure (D1, Email Routing)
        run: tofu -chdir=infra/core apply -input=false -auto-approve

      - name: Read core outputs
        run: |
          echo "D1_DATABASE_ID=$(tofu -chdir=infra/core output -raw database_id)" >> "$GITHUB_ENV"
          echo "D1_DATABASE_NAME=$(tofu -chdir=infra/core output -raw database_name)" >> "$GITHUB_ENV"

      - name: Render wrangler.toml
        run: uv run python scripts/render_wrangler.py

      - name: Apply D1 migrations
        run: npx --yes wrangler@4 d1 migrations apply "$D1_DATABASE_NAME" --remote

      - name: Deploy Worker
        run: uv run pywrangler deploy

      - name: Upload Worker secrets
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          WEBHOOK_SECRET: ${{ secrets.WEBHOOK_SECRET }}
          ADMIN_TOKEN: ${{ secrets.ADMIN_TOKEN }}
          CF_API_TOKEN: ${{ secrets.CF_EMAIL_API_TOKEN }}
        run: |
          secrets_file="$RUNNER_TEMP/worker-secrets.json"
          trap 'rm -f "$secrets_file"' EXIT
          jq -n \
            --arg BOT_TOKEN "$BOT_TOKEN" \
            --arg WEBHOOK_SECRET "$WEBHOOK_SECRET" \
            --arg ADMIN_TOKEN "$ADMIN_TOKEN" \
            --arg CF_API_TOKEN "$CF_API_TOKEN" \
            '$ARGS.named' > "$secrets_file"
          npx --yes wrangler@4 secret bulk "$secrets_file"

      - name: Apply email routing rule
        run: tofu -chdir=infra/routing apply -input=false -auto-approve

      - name: Register webhook and bot commands
        env:
          ADMIN_TOKEN: ${{ secrets.ADMIN_TOKEN }}
          WORKER_URL: ${{ vars.WORKER_URL }}
        run: |
          curl --fail-with-body -sS -X POST \
            -H "Authorization: Bearer ${ADMIN_TOKEN}" \
            "${WORKER_URL%/}/admin/setup"
