name: CI

on:
  pull_request:
  push:
    branches: [master]
  workflow_call:

permissions:
  contents: read

jobs:
  python:
    name: Lint, typecheck, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked

      - name: Ruff lint
        run: uv run ruff check

      - name: Ruff format
        run: uv run ruff format --check

      - name: Mypy (strict)
        run: uv run mypy

      - name: Pytest (coverage + typeguard)
        run: uv run pytest

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml
          if-no-files-found: ignore

  infra:
    name: OpenTofu fmt / validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: opentofu/setup-opentofu@v1
        with:
          tofu_wrapper: false

      - name: tofu fmt
        run: tofu fmt -check -recursive infra

      - name: tofu validate
        run: |
          for module in infra/core infra/routing; do
            tofu -chdir="$module" init -backend=false -input=false
            tofu -chdir="$module" validate
          done

  plan:
    name: OpenTofu plan (core)
    # Only for PRs from this repository: forks do not receive secrets.
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    needs: infra
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      TF_VAR_account_id: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      TF_VAR_zone_id: ${{ vars.CLOUDFLARE_ZONE_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: opentofu/setup-opentofu@v1
        with:
          tofu_wrapper: false

      - name: tofu init
        run: |
          tofu -chdir=infra/core init -input=false \
            -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" \
            -backend-config="endpoints={s3=\"https://${{ vars.CLOUDFLARE_ACCOUNT_ID }}.r2.cloudflarestorage.com\"}"

      - name: tofu plan
        run: tofu -chdir=infra/core plan -input=false -lock=false -no-color
