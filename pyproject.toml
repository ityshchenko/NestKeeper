[project]
name = "nestkeeper"
version = "0.1.0"
description = "Serverless Telegram bot that manages an email mailing list on Cloudflare (free tier)"
readme = "README.md"
license = "BSD-3-Clause"
requires-python = ">=3.14"
# Runtime dependencies are vendored into the Worker by pywrangler; both are Pyodide-compatible.
dependencies = [
    "pydantic>=2.10",
    "structlog>=24.4",
]

[dependency-groups]
dev = [
    "mypy>=1.13",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "ruff>=0.8",
    "typeguard>=4.4",
    "workers-py>=1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nestkeeper"]

[tool.ruff]
line-length = 100
target-version = "py314"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "N", "S", "SIM", "RUF", "ASYNC", "PT", "RET", "BLE", "ARG", "C4", "PL", "TRY"]
ignore = ["TRY400", "PLR0911", "PLR0913", "TRY003", "RUF001", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "PLR2004", "ARG"]
# conftest must import nestkeeper lazily so typeguard can instrument it (see conftest docstring).
"tests/conftest.py" = ["S101", "PLC0415"]

[tool.mypy]
strict = true
python_version = "3.14"
mypy_path = "src"
files = ["src", "tests", "scripts"]
plugins = ["pydantic.mypy"]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[[tool.mypy.overrides]]
# Pyodide / Workers runtime modules only exist inside the Worker.
module = ["js", "js.*", "pyodide", "pyodide.*", "workers", "workers.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# The Worker entrypoint subclasses an untyped runtime base class.
module = ["nestkeeper.entry"]
disallow_subclassing_any = false

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = [
    "--strict-markers",
    "--typeguard-packages=nestkeeper",
    "--cov=nestkeeper",
    "--cov-report=term-missing",
    "--cov-report=xml",
    "--cov-fail-under=90",
]

[tool.coverage.run]
branch = true
source = ["nestkeeper"]
omit = ["src/nestkeeper/entry.py"]

[tool.coverage.report]
exclude_also = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "\\.\\.\\.",
]
